<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20x='10'%20y='20'%20width='80'%20height='50'%20rx='10'%20fill='%234F46E5'/%3E%3Cpath%20d='M20%2070%20L30%2060%20H70%20Q80%2060%2080%2050%20V30'%20fill='%234F46E5'/%3E%3Ctext%20x='50'%20y='55'%20text-anchor='middle'%20font-size='36'%20fill='white'%20font-family='Georgia,%20serif'%3E%CF%80%3C/text%3E%3Ccircle%20cx='80'%20cy='20'%20r='3'%20fill='%23A78BFA'/%3E%3Ccircle%20cx='85'%20cy='15'%20r='2'%20fill='%23C4B5FD'/%3E%3C/svg%3E" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5', // Indigo 600
                        secondary: '#6B7280', // Gray 500
                        dark: '#111827',
                        light: '#F9FAFB'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .message-appear {
            animation: fadeIn 0.3s ease-in-out;
        }
        .typing-indicator span {
            animation: blink 1.4s infinite both;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes blink {
            0% { opacity: 0.1; }
            20% { opacity: 1; }
            100% { opacity: 0.1; }
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .scrollbar-thin::-webkit-scrollbar {
            width: 4px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 20px;
        }
        .message-user {
            border-radius: 18px 18px 0 18px;
        }
        .message-assistant {
            border-radius: 18px 18px 18px 0;
        }
    </style>
    <!-- Environment variables injection -->
</head>
<body class="bg-gray-50 text-gray-900 flex flex-col h-screen overflow-hidden">
    <!-- Chat header -->
    <header class="bg-white border-b border-gray-200 shadow-sm py-4 px-4 lg:px-6">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-8 w-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center">
                    <i class="fas fa-robot text-white text-sm"></i>
                </div>
                <h1 class="text-lg font-semibold text-gray-800">Agentic Calculator</h1>
            </div>
            <div class="flex items-center text-gray-500">
                <span class="text-xs px-2 py-1 bg-green-100 text-green-800 rounded-full font-medium">Online</span>
            </div>
        </div>
    </header>

    <!-- Chat messages container -->
    <main class="flex-1 overflow-y-auto py-6 px-4 lg:px-6 scrollbar-thin bg-gradient-to-b from-gray-50 to-gray-100" id="chat-messages">
        <div class="max-w-3xl mx-auto space-y-6">
            <!-- Welcome message -->
            <div class="flex items-start space-x-3 message-appear">
                <div class="h-8 w-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center flex-shrink-0 mt-1">
                    <i class="fas fa-robot text-white text-xs"></i>
                </div>
                <div class="bg-white message-assistant p-4 shadow-sm rounded-lg max-w-md">
                    <p class="text-gray-700">Hi there! I'm your AI math assistant. How can I help you today?</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Input area fixed at bottom -->
    <footer class="bg-white border-t border-gray-200 p-4 lg:p-5">
        <div class="max-w-3xl mx-auto">
            <form id="chat-form" class="relative">
                <input 
                    type="text" 
                    id="message-input" 
                    class="w-full rounded-full border border-gray-300 bg-gray-50 px-4 py-3 pr-16 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent shadow-sm"
                    placeholder="Type your message here..."
                    aria-label="Message input">
                <button 
                    id="send-button" 
                    class="absolute right-2 top-1/2 -translate-y-1/2 rounded-full bg-primary text-white h-9 w-9 flex items-center justify-center hover:bg-indigo-700 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
                    aria-label="Send message">
                    <i class="fas fa-paper-plane text-sm"></i>
                </button>
            </form>
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const messageInput = document.getElementById('message-input');
            const sendButton = document.getElementById('send-button');
            const chatMessages = document.getElementById('chat-messages');
            const chatForm = document.getElementById('chat-form');
            
            // Function to add a message to the chat area
            function addMessage(message, sender) {
                const messageContainer = document.createElement('div');
                messageContainer.className = 'max-w-3xl mx-auto';
                
                const messageElement = document.createElement('div');
                const isUser = sender === 'user';

                messageElement.className = `flex items-start space-x-3 message-appear ${isUser ? 'justify-end' : ''}`;
                
                if (isUser) {
                    messageElement.innerHTML = `
                        <div class="bg-primary message-user p-4 shadow-sm rounded-lg max-w-md">
                            <p class="text-white">${message}</p>
                        </div>
                        <div class="h-8 w-8 rounded-full bg-gray-200 flex items-center justify-center flex-shrink-0 mt-1">
                            <i class="fas fa-user text-gray-500 text-xs"></i>
                        </div>
                    `;
                } else {
                    messageElement.innerHTML = `
                        <div class="h-8 w-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center flex-shrink-0 mt-1">
                            <i class="fas fa-robot text-white text-xs"></i>
                        </div>
                        <div class="bg-white message-assistant p-4 shadow-sm rounded-lg max-w-md">
                            <p class="text-gray-700">${message}</p>
                        </div>
                    `;
                }
                
                messageContainer.appendChild(messageElement);
                chatMessages.appendChild(messageContainer);
                
                // Scroll to bottom of chat with smooth animation
                chatMessages.scrollTo({
                    top: chatMessages.scrollHeight,
                    behavior: 'smooth'
                });
            }

            // Function to show loading indicator
            function showLoading() {
                const loadingContainer = document.createElement('div');
                loadingContainer.className = 'max-w-3xl mx-auto';
                
                const loadingElement = document.createElement('div');
                loadingElement.className = 'flex items-start space-x-3 message-appear';
                loadingElement.id = 'loading-indicator';
                
                loadingElement.innerHTML = `
                    <div class="h-8 w-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center flex-shrink-0 mt-1">
                        <i class="fas fa-robot text-white text-xs"></i>
                    </div>
                    <div class="bg-white message-assistant p-4 shadow-sm rounded-lg typing-indicator flex items-center space-x-1">
                        <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
                    </div>
                `;
                
                loadingContainer.appendChild(loadingElement);
                chatMessages.appendChild(loadingContainer);
                chatMessages.scrollTo({
                    top: chatMessages.scrollHeight,
                    behavior: 'smooth'
                });
            }

            // Function to hide loading indicator
            function hideLoading() {
                const loadingIndicator = document.getElementById('loading-indicator');
                if (loadingIndicator && loadingIndicator.parentElement) {
                    loadingIndicator.parentElement.remove();
                }
            }

            // Function to handle message submission
            function handleMessageSubmit(event) {
                if (event) event.preventDefault();
                
                const message = messageInput.value.trim();
                
                if (message) {
                    // Add user message to chat
                    addMessage(message, 'user');
                    
                    // Clear input field
                    messageInput.value = '';
                    
                    // Show loading indicator
                    showLoading();
                    
                    // Encode query for URL
                    const query = encodeURIComponent(message);
                    
                    fetch(`/api?q=${query}`)
                        .then(response => response.json())
                        .then(data => {
                            hideLoading();
                            console.log(data);
                            if (data.result) {
                                addMessage(data.result, 'assistant');
                            } else {
                                addMessage('Sorry, I did not receive a valid response.', 'assistant');
                            }
                        })
                        .catch(error => {
                            hideLoading();
                            console.error('API Error:', error);
                            addMessage('Error contacting the server. Please try again.', 'assistant');
                        });
                }
            }

            // Event listeners
            chatForm.addEventListener('submit', handleMessageSubmit);
            
            // Set focus to input on page load
            messageInput.focus();
        });
    </script>
</body>
</html>
