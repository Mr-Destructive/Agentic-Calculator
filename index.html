<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5', // Indigo 600
                        secondary: '#6B7280', // Gray 500
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 h-screen flex flex-col">
    <!-- Chat header -->
    <header class="bg-white shadow-sm p-4 flex justify-center">
        <h1 class="text-xl font-semibold text-gray-800">Chat Interface</h1>
    </header>

    <!-- Chat messages container -->
    <main class="flex-1 overflow-y-auto p-4 space-y-4" id="chat-messages">
        <!-- Messages will be added here dynamically -->
        <div class="flex justify-center">
            <p class="text-gray-500 text-sm">Type a message below to start chatting.</p>
        </div>
    </main>

    <!-- Input area fixed at bottom -->
    <footer class="bg-white border-t border-gray-200 p-4">
        <div class="max-w-4xl mx-auto flex">
            <input 
                type="text" 
                id="message-input" 
                class="flex-1 rounded-l-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                placeholder="Type your message here..."
                aria-label="Message input">
            <button 
                id="send-button" 
                class="bg-primary text-white px-6 py-2 rounded-r-lg hover:bg-indigo-700 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
                aria-label="Send message">
                Send
            </button>
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        window.ENV = {
            API_URL: '%%API_URL%%'
        };
        document.addEventListener('DOMContentLoaded', () => {
            const messageInput = document.getElementById('message-input');
            const sendButton = document.getElementById('send-button');
            const chatMessages = document.getElementById('chat-messages');
            const API_URL = window.ENV.API_URL || 'http://localhost:3000';

            // Function to add a message to the chat area
            function addMessage(message, sender) {
                const messageElement = document.createElement('div');
                const isUser = sender === 'user';

                messageElement.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
                
                messageElement.innerHTML = `
                    <div class="max-w-xs md:max-w-md lg:max-w-lg ${isUser ? 'bg-primary text-white' : 'bg-white text-gray-800'} rounded-lg px-4 py-2 shadow ${isUser ? 'rounded-tr-none' : 'rounded-tl-none'}">
                        ${message}
                    </div>
                `;
                
                chatMessages.appendChild(messageElement);
                // Scroll to bottom of chat
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // Function to show loading indicator
            function showLoading() {
                const loadingElement = document.createElement('div');
                loadingElement.className = 'flex justify-start';
                loadingElement.id = 'loading-indicator';
                
                loadingElement.innerHTML = `
                    <div class="bg-white text-gray-800 rounded-lg px-4 py-2 shadow rounded-tl-none flex items-center space-x-1">
                        <span class="w-2 h-2 bg-gray-300 rounded-full animate-pulse"></span>
                        <span class="w-2 h-2 bg-gray-300 rounded-full animate-pulse delay-75"></span>
                        <span class="w-2 h-2 bg-gray-300 rounded-full animate-pulse delay-150"></span>
                    </div>
                `;
                
                chatMessages.appendChild(loadingElement);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // Function to hide loading indicator
            function hideLoading() {
                const loadingIndicator = document.getElementById('loading-indicator');
                if (loadingIndicator) {
                    loadingIndicator.remove();
                }
            }

            // Function to handle message submission
            function handleMessageSubmit() {
                const message = messageInput.value.trim();
                
                if (message) {
                    // Add user message to chat
                    addMessage(message, 'user');
                    
                    // Clear input field
                    messageInput.value = '';
                    
                    // Show loading indicator
                    showLoading();
                    
                    // Encode query for URL
                    const query = encodeURIComponent(message);
                    
                    // Real API call to your backend
                    fetch(`${API_URL}?q=${query}`)
                        .then(response => response.json())
                        .then(data => {
                            hideLoading();
                            console.log(data);
                            if (data.result) {
                                addMessage(data.result, 'assistant');
                            } else {
                                addMessage('Sorry, I did not receive a valid response.', 'assistant');
                            }
                        })
                        .catch(error => {
                            hideLoading();
                            console.error('API Error:', error);
                            addMessage('Error contacting the server. Please try again.', 'assistant');
                        });
                }
            }

            // Event listeners
            sendButton.addEventListener('click', handleMessageSubmit);
            
            // Handle Enter key press
            messageInput.addEventListener('keypress', (event) => {
                if (event.key === 'Enter') {
                    handleMessageSubmit();
                }
            });

            // Set focus to input on page load
            messageInput.focus();
        });
    </script>
</body>
</html>
